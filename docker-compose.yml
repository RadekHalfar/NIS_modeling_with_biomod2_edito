services:
  biomod2-modeling:
    build: .
    image: biomod2-modeling:latest
    volumes:
      # Mount output directory to save results
      - ./output:/app/output
      # Mount occurrence data (read-only)
      - ./input:/app/input:ro
    environment:
      - TZ=UTC
    # Arguments for modeling_mixedPA.R
    command:
      - Bugulaneritina
      - GLM,GAM,RF,MAXNET
      - "2000"
      - "100000"
      - kfold
      - "3"
      - "NULL"
      - "5"
      - "4"
      - /app/input/myExpl_shelf_DISTFIX.tif
      - /app/output
